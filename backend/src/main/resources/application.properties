# ===============================
# Centralized Placement Portal (CPP) - Backend Configuration
# ===============================

spring.application.name=centralized-placement-portal

# ---- Server ----
server.port=8080

# ---- MySQL Datasource ----
# Update username/password to match your local MySQL installation.
# The database itself is auto-created thanks to createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/centralized_placement_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Oli@1425
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' will create/alter tables automatically based on the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- JWT ----
# IMPORTANT: change this secret before deploying anywhere beyond your own machine.
app.jwt.secret=cppSuperSecretSigningKeyChangeThisInProduction123456789
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Demo data ----
# Seeds a demo TPO account, demo students, jobs and AI prep guides on first run.
app.seed-demo-data=true

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.cpp.placement=DEBUG
